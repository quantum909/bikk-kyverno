apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: validate-resource-quotas
policies:
  - ../../policies/validate-resource-quota.yaml
resources:
  - pod-success.yaml
  - pod-fail.yaml
results:
  - policy: test/require-requests-limits
    rule: validate-resources
    resources: 
      - test/pod-success
    kind: Pod
    result: pass
  
  - policy: test/require-requests-limits
    rule: validate-resources
    resources:
      - test/pod-fail-no-requests
    kind: Pod
    result: fail
  
  - policy: test/require-requests-limits
    rule: validate-resources
    resources:
      - test/pod-fail-no-limits
    kind: Pod
    result: fail
