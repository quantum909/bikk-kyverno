apiVersion: apps/v1
kind: Deployment
metadata:
  name: dep-target
  namespace: bikkfabian
  labels:
    storage.example/attach-emptydir: "true"
    app.kubernetes.io/managed-by: kyverno
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dep-target
  template:
    metadata:
      labels:
        app: dep-target
    spec:
      volumes:
        - name: workdir
          emptyDir:
            sizeLimit: 256Mi
      containers:
        - name: app
          image: nginx:1.25-alpine
          volumeMounts:
            - name: workdir
              mountPath: /work
