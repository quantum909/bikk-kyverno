apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: add-emptydir-workdir
  namespace: bikkfabian
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: add-workdir-emptydir
      match:
        any:
          - resources:
              kinds:
                - Deployment
              selector:
                matchLabels:
                  storage.example/attach-emptydir: "true"
      exclude:
        any:
          - resources:
              selector:
                matchLabels:
                  storage.example/skip-emptydir: "true"
      mutate:
        patchStrategicMerge:
          spec:
            template:
              spec:
                volumes:
                  - (name): workdir
                    emptyDir:
                      sizeLimit: 256Mi
                containers:
                  - (name): "*"
                    volumeMounts:
                      - (name): workdir
                        mountPath: /work
