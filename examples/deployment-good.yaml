apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-good
  namespace: bikkfabian
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-good
  template:
    metadata:
      labels:
        app: nginx-good
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
