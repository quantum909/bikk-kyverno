apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-good
  namespace: bikkfabian
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-good
  template:
    metadata:
      labels:
        app: nginx-good
    spec:
      initContainers:
        - name: init-ok
          image: busybox:1.36
          command: ["sh","-c","echo init && sleep 1"]
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      ephemeralContainers:
        - name: eph-ok
          image: busybox:1.36
          command: ["sh","-c","sleep 3600"]
          targetContainerName: nginx
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "20m"
              memory: "32Mi"
