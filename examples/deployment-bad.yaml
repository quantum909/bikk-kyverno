apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-bad
  namespace: bikkfabian
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-bad
  template:
    metadata:
      labels:
        app: nginx-bad
    spec:
      initContainers:
        - name: init-missing
          image: busybox:1.36
          command: ["sh","-c","echo init && sleep 1"]
          # intentionally missing resources
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          # intentionally missing resources
      ephemeralContainers:
        - name: eph-missing
          image: busybox:1.36
          command: ["sh","-c","sleep 3600"]
          targetContainerName: nginx
          # intentionally missing resources
